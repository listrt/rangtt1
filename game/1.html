<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星穹守卫 · 塔防</title>
    <style>
        :root {
            --bg-page: #eef2f7;
            --bg-card: #ffffff;
            --bg-card-hover: #e2e8f0;
            --bg-toolbar: #e8ecf5;
            --bg-canvas: #dce3ec;
            --border-light: #c8d4e0;
            --text-primary: #1a1a2e;
            --text-secondary: #3a3a5a;
            --text-muted: #6a6a8a;
            --shadow: 0 12px 40px rgba(0,0,0,0.08);
            --shadow-hover: 0 16px 56px rgba(0,0,0,0.16);
            --radius: 18px;
            --transition: 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
            --health-bg: rgba(200,40,40,0.20);
            --health-fg: #d62b2b;
            --path-color: rgba(120,140,180,0.20);
            --path-stroke: rgba(80,100,150,0.18);
            --grid-color: rgba(120,140,180,0.06);
            --btn-bg: #e2e8f0;
            --btn-text: #1a1a2e;
            --btn-border: #c4d0e0;
            --glow-color: rgba(30, 120, 255, 0.45);
            --gold-glow: #d4a02b;
        }
        [data-theme="dark"] {
            --bg-page: #0b0b18;
            --bg-card: #16162e;
            --bg-card-hover: #202044;
            --bg-toolbar: #12122a;
            --bg-canvas: #0f0f22;
            --border-light: #28284a;
            --text-primary: #e4e4f0;
            --text-secondary: #b0b0d4;
            --text-muted: #70709a;
            --shadow: 0 12px 40px rgba(0,0,0,0.60);
            --shadow-hover: 0 16px 56px rgba(0,0,0,0.80);
            --health-bg: rgba(200,40,40,0.16);
            --health-fg: #f04747;
            --path-color: rgba(60,80,160,0.22);
            --path-stroke: rgba(40,60,140,0.18);
            --grid-color: rgba(60,80,160,0.07);
            --btn-bg: #1a1a36;
            --btn-text: #d4d4ec;
            --btn-border: #2a2a4e;
            --glow-color: rgba(160, 80, 255, 0.50);
            --gold-glow: #e8b84a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            margin: 0;
            transition: background var(--transition), color var(--transition);
        }
        .game-wrapper {
            max-width: 1060px;
            width: 100%;
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px 26px 26px 26px;
            transition: background var(--transition), box-shadow var(--transition), border-color var(--transition);
            border: 1px solid var(--border-light);
        }

        /* ===== 顶栏 ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-light);
            transition: border-color var(--transition);
            margin-bottom: 16px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }
        .game-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #f5b342, #e07c3a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            user-select: none;
        }
        .header-stats {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 15px;
            font-weight: 500;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-toolbar);
            padding: 6px 16px 6px 14px;
            border-radius: 40px;
            transition: background var(--transition), border-color var(--transition);
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
        }
        .stat-item .value {
            font-weight: 600;
            color: var(--text-primary);
            min-width: 20px;
        }
        .stat-item .value.gold {
            color: var(--gold-glow);
        }
        .health-bar-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-toolbar);
            padding: 4px 16px 4px 12px;
            border-radius: 40px;
            border: 1px solid var(--border-light);
            transition: background var(--transition), border-color var(--transition);
        }
        .health-icon-svg {
            width: 18px;
            height: 18px;
            fill: var(--health-fg);
            transition: fill var(--transition);
        }
        .health-bar-track {
            width: 86px;
            height: 8px;
            background: var(--health-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: background var(--transition);
        }
        .health-bar-fill {
            height: 100%;
            width: 100%;
            background: var(--health-fg);
            border-radius: 12px;
            transition: width 0.4s ease, background var(--transition);
        }

        /* ===== 按钮基础样式 (圆角长方形 + 光效) ===== */
        .ctrl-btn, .theme-btn, .tower-btn {
            position: relative;
            overflow: hidden;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--btn-text);
            border-radius: 40px;
            padding: 8px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.3s, background 0.3s, border-color 0.3s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            user-select: none;
        }
        .ctrl-btn:hover, .theme-btn:hover, .tower-btn:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-hover);
            border-color: #7a9aff;
        }
        .ctrl-btn:active, .theme-btn:active, .tower-btn:active {
            transform: scale(0.94);
        }

        /* 光效伪元素 */
        .ctrl-btn::after, .theme-btn::after, .tower-btn::after {
            content: '';
            position: absolute;
            top: -60%;
            left: -60%;
            width: 220%;
            height: 220%;
            background: linear-gradient(45deg, transparent 40%, var(--glow-color) 50%, transparent 60%);
            transform: rotate(45deg) translateX(-120%) translateY(-120%);
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.4, 1);
            pointer-events: none;
        }
        .ctrl-btn:hover::after, .theme-btn:hover::after, .tower-btn:hover::after {
            transform: rotate(45deg) translateX(20%) translateY(20%);
        }

        /* 选中状态 */
        .tower-btn.selected {
            border-color: #4a7aff;
            background: rgba(74, 122, 255, 0.15);
            box-shadow: 0 0 0 3px rgba(74, 122, 255, 0.15);
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .theme-btn {
            padding: 8px 16px;
        }

        /* ===== 画布 ===== */
        .canvas-wrap {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-light);
            background: var(--bg-canvas);
            transition: border-color var(--transition), background var(--transition);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.04);
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 900 / 550;
            background: transparent;
            cursor: crosshair;
            touch-action: none;
        }

        /* ===== 底部工具栏 ===== */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px 18px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-light);
            transition: border-color var(--transition);
        }
        .tower-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .tower-btn .tower-preview {
            display: inline-block;
            width: 26px;
            height: 26px;
            border-radius: 8px;
            margin-right: 2px;
        }
        .tower-preview.fire { background: radial-gradient(circle at 30% 30%, #ff7a3a, #d94a1a); }
        .tower-preview.ice { background: radial-gradient(circle at 30% 30%, #6ac8ff, #1a7ad4); }
        .tower-preview.thunder { background: radial-gradient(circle at 30% 30%, #f5d742, #b87a1a); }
        .tower-btn .cost {
            color: var(--gold-glow);
            font-weight: 700;
        }
        .wave-info {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--bg-toolbar);
            padding: 6px 20px;
            border-radius: 40px;
            border: 1px solid var(--border-light);
            transition: background var(--transition), border-color var(--transition);
        }
        .wave-info span {
            font-weight: 700;
            color: var(--text-primary);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 720px) {
            .game-wrapper { padding: 14px 14px 18px; }
            .header { flex-direction: column; align-items: stretch; gap: 10px; }
            .header-left { flex-wrap: wrap; justify-content: space-between; }
            .header-stats { justify-content: space-around; }
            .health-bar-track { width: 60px; }
            .game-title { font-size: 20px; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .tower-buttons { justify-content: center; }
            .wave-info { text-align: center; }
            .ctrl-btn, .theme-btn, .tower-btn { padding: 6px 14px; font-size: 12px; }
        }
        @media (max-width: 460px) {
            .stat-item { padding: 4px 10px; font-size: 12px; }
            .tower-btn { padding: 4px 10px; font-size: 11px; }
            .health-bar-track { width: 44px; }
            .game-title { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <!-- 顶栏 -->
        <header class="header">
            <div class="header-left">
                <div class="game-title">✦ 星穹守卫</div>
                <div class="header-stats">
                    <div class="stat-item">
                        <span class="value gold" id="goldDisplay">120</span>
                        <span style="font-size:13px; color:var(--gold-glow);">G</span>
                    </div>
                    <div class="stat-item">
                        <span>波次</span>
                        <span class="value" id="waveDisplay">0</span>
                    </div>
                    <div class="health-bar-wrap">
                        <svg class="health-icon-svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <div class="health-bar-track">
                            <div class="health-bar-fill" id="healthFill" style="width:100%"></div>
                        </div>
                        <span style="font-size:13px; font-weight:600; min-width:18px;" id="healthText">20</span>
                    </div>
                </div>
            </div>
            <div class="header-controls">
                <button class="ctrl-btn" id="btnStart">开始</button>
                <button class="ctrl-btn" id="btnSpeed">加速</button>
                <button class="ctrl-btn" id="btnRestart">重置</button>
                <button class="theme-btn" id="themeToggle">主题</button>
            </div>
        </header>

        <!-- 画布 -->
        <div class="canvas-wrap">
            <canvas id="gameCanvas" width="900" height="550"></canvas>
        </div>

        <!-- 底部工具栏 -->
        <div class="toolbar">
            <div class="tower-buttons">
                <button class="tower-btn" data-tower="fire" id="towerFire">
                    <span class="tower-preview fire"></span> 火焰 <span class="cost">G80</span>
                </button>
                <button class="tower-btn" data-tower="ice" id="towerIce">
                    <span class="tower-preview ice"></span> 冰霜 <span class="cost">G100</span>
                </button>
                <button class="tower-btn" data-tower="thunder" id="towerThunder">
                    <span class="tower-preview thunder"></span> 闪电 <span class="cost">G130</span>
                </button>
                <button class="tower-btn" id="btnDeselect" style="border-color:transparent; background:transparent; box-shadow:none; color:var(--text-muted);">取消</button>
            </div>
            <div class="wave-info">
                下一波 <span id="nextWaveCount">5</span> 个敌人
            </div>
        </div>
    </div>

    <script>
        (function() {
            // 获取 DOM 元素
            var canvas = document.getElementById('gameCanvas');
            var ctx = canvas.getContext('2d');
            var goldSpan = document.getElementById('goldDisplay');
            var waveSpan = document.getElementById('waveDisplay');
            var healthFill = document.getElementById('healthFill');
            var healthText = document.getElementById('healthText');
            var nextWaveSpan = document.getElementById('nextWaveCount');
            var btnStart = document.getElementById('btnStart');
            var btnSpeed = document.getElementById('btnSpeed');
            var btnRestart = document.getElementById('btnRestart');
            var themeToggle = document.getElementById('themeToggle');
            var towerFire = document.getElementById('towerFire');
            var towerIce = document.getElementById('towerIce');
            var towerThunder = document.getElementById('towerThunder');
            var btnDeselect = document.getElementById('btnDeselect');

            var CW = 900, CH = 550;
            canvas.width = CW; canvas.height = CH;

            // 路径定义
            var pathPoints = [
                {x:60,y:80},{x:200,y:80},{x:200,y:240},
                {x:440,y:240},{x:440,y:100},{x:640,y:100},
                {x:640,y:320},{x:360,y:320},{x:360,y:440},
                {x:780,y:440},{x:780,y:160},{x:860,y:160}
            ];
            var pathSegments = [];
            for (var i=1; i<pathPoints.length; i++) {
                var dx = pathPoints[i].x - pathPoints[i-1].x;
                var dy = pathPoints[i].y - pathPoints[i-1].y;
                pathSegments.push({dx:dx, dy:dy, len:Math.hypot(dx,dy), from:pathPoints[i-1], to:pathPoints[i]});
            }
            var totalPathLen = 0;
            for (var s=0; s<pathSegments.length; s++) totalPathLen += pathSegments[s].len;

            function getPosOnPath(progress) {
                var p = progress % 1;
                var target = p * totalPathLen;
                var acc = 0;
                for (var j=0; j<pathSegments.length; j++) {
                    var seg = pathSegments[j];
                    if (target <= acc + seg.len) {
                        var t = (target - acc) / seg.len;
                        return {x: seg.from.x + seg.dx * t, y: seg.from.y + seg.dy * t};
                    }
                    acc += seg.len;
                }
                return {x: pathPoints[pathPoints.length-1].x, y: pathPoints[pathPoints.length-1].y};
            }

            // 游戏状态
            var game = {
                gold: 120,
                wave: 0,
                health: 20,
                maxHealth: 20,
                enemies: [],
                towers: [],
                bullets: [],
                isRunning: false,
                speed: 1,
                enemySpawnTimer: 0,
                enemiesThisWave: 0,
                maxEnemiesThisWave: 5,
                spawnInterval: 1.2,
                selectedTower: null,
                frameCount: 0
            };

            var towerCosts = {fire:80, ice:100, thunder:130};
            var towerColors = {fire:'#e06020', ice:'#2080e0', thunder:'#e0b020'};
            var towerRadii = {fire:25, ice:22, thunder:30};

            function resetGame() {
                game.gold = 120;
                game.wave = 0;
                game.health = 20;
                game.maxHealth = 20;
                game.enemies = [];
                game.towers = [];
                game.bullets = [];
                game.isRunning = false;
                game.speed = 1;
                game.enemySpawnTimer = 0;
                game.enemiesThisWave = 0;
                game.maxEnemiesThisWave = 5;
                game.selectedTower = null;
                game.frameCount = 0;
                btnStart.textContent = '开始';
                updateUI();
                updateButtons();
            }

            function updateUI() {
                goldSpan.textContent = game.gold;
                waveSpan.textContent = game.wave;
                var hpPercent = (game.health / game.maxHealth) * 100;
                if (hpPercent < 0) hpPercent = 0;
                healthFill.style.width = hpPercent + '%';
                healthText.textContent = Math.floor(game.health);
                nextWaveSpan.textContent = game.maxEnemiesThisWave;
            }

            function updateButtons() {
                var btns = [towerFire, towerIce, towerThunder];
                btns.forEach(function(b) { b.classList.remove('selected'); });
                if (game.selectedTower) {
                    var map = {fire: towerFire, ice: towerIce, thunder: towerThunder};
                    if (map[game.selectedTower]) map[game.selectedTower].classList.add('selected');
                }
            }

            function spawnEnemy() {
                var hp = 5 + game.wave * 2;
                var speed = 0.7 + game.wave * 0.04;
                var reward = 10 + game.wave * 2;
                var type = 'normal';
                var r = Math.random();
                if (r < 0.2 && game.wave > 2) type = 'fast';
                else if (r < 0.4 && game.wave > 4) type = 'tank';
                if (type === 'fast') { hp = Math.floor(hp * 0.6); speed *= 1.5; reward += 5; }
                if (type === 'tank') { hp = Math.floor(hp * 2.2); speed *= 0.6; reward += 12; }
                game.enemies.push({
                    progress: 0,
                    hp: hp,
                    maxHp: hp,
                    speed: speed,
                    reward: reward,
                    type: type,
                    x: pathPoints[0].x,
                    y: pathPoints[0].y,
                    alive: true,
                    slowTimer: 0,
                    slowFactor: 1
                });
            }

            function startWave() {
                if (game.isRunning) return;
                if (game.health <= 0) return;
                game.wave++;
                game.enemiesThisWave = 0;
                game.maxEnemiesThisWave = 5 + game.wave * 3;
                game.spawnInterval = Math.max(0.4, 1.2 - game.wave * 0.04);
                game.isRunning = true;
                btnStart.textContent = '暂停';
                updateUI();
            }

            function placeTower(x, y, type) {
                var cost = towerCosts[type];
                if (game.gold < cost) return false;
                var canPlace = true;
                for (var i=0; i<game.towers.length; i++) {
                    var dx = game.towers[i].x - x;
                    var dy = game.towers[i].y - y;
                    if (Math.hypot(dx,dy) < 40) { canPlace = false; break; }
                }
                if (!canPlace) return false;
                game.gold -= cost;
                game.towers.push({
                    x: x, y: y, type: type,
                    cooldown: 0,
                    range: type==='fire'?120 : type==='ice'?100 : 150,
                    damage: type==='fire'?15 : type==='ice'?8 : 25,
                    attackSpeed: type==='fire'?0.8 : type==='ice'?1.0 : 0.5,
                    color: towerColors[type],
                    radius: towerRadii[type]
                });
                updateUI();
                return true;
            }

            function fireTower(tower) {
                if (tower.cooldown > 0) return;
                var target = null;
                var minDist = 9999;
                for (var i=0; i<game.enemies.length; i++) {
                    var e = game.enemies[i];
                    if (!e.alive) continue;
                    var dx = e.x - tower.x;
                    var dy = e.y - tower.y;
                    var dist = Math.hypot(dx,dy);
                    if (dist < tower.range && dist < minDist) {
                        minDist = dist;
                        target = e;
                    }
                }
                if (!target) return;
                tower.cooldown = tower.attackSpeed;
                var bullet = {
                    x: tower.x, y: tower.y,
                    target: target,
                    speed: 4,
                    damage: tower.damage,
                    type: tower.type,
                    alive: true,
                    color: tower.color
                };
                game.bullets.push(bullet);
            }

            function updateEnemies(dt) {
                for (var i=game.enemies.length-1; i>=0; i--) {
                    var e = game.enemies[i];
                    if (!e.alive) {
                        game.enemies.splice(i,1);
                        continue;
                    }
                    if (e.slowTimer > 0) {
                        e.slowTimer -= dt;
                        e.slowFactor = 0.4;
                    } else {
                        e.slowFactor = 1;
                    }
                    var speed = e.speed * e.slowFactor * dt * 60;
                    e.progress += speed / totalPathLen;
                    if (e.progress >= 1) {
                        e.alive = false;
                        game.health -= 1;
                        if (game.health < 0) game.health = 0;
                        updateUI();
                        if (game.health <= 0) {
                            game.isRunning = false;
                            btnStart.textContent = '开始';
                        }
                        game.enemies.splice(i,1);
                        continue;
                    }
                    var pos = getPosOnPath(e.progress);
                    e.x = pos.x;
                    e.y = pos.y;
                }
            }

            function updateBullets(dt) {
                for (var i=game.bullets.length-1; i>=0; i--) {
                    var b = game.bullets[i];
                    if (!b.alive) { game.bullets.splice(i,1); continue; }
                    if (!b.target || !b.target.alive) {
                        b.alive = false;
                        game.bullets.splice(i,1);
                        continue;
                    }
                    var dx = b.target.x - b.x;
                    var dy = b.target.y - b.y;
                    var dist = Math.hypot(dx,dy);
                    if (dist < 6) {
                        b.target.hp -= b.damage;
                        if (b.type === 'ice') {
                            b.target.slowTimer = 1.5;
                        }
                        if (b.target.hp <= 0) {
                            b.target.alive = false;
                            game.gold += b.target.reward;
                            updateUI();
                        }
                        b.alive = false;
                        game.bullets.splice(i,1);
                        continue;
                    }
                    var step = b.speed * dt * 60;
                    var ratio = step / dist;
                    if (ratio > 1) ratio = 1;
                    b.x += dx * ratio;
                    b.y += dy * ratio;
                }
            }

            function updateTowers(dt) {
                for (var i=0; i<game.towers.length; i++) {
                    var t = game.towers[i];
                    if (t.cooldown > 0) t.cooldown -= dt;
                    fireTower(t);
                }
            }

            function updateWave(dt) {
                if (!game.isRunning) return;
                if (game.enemiesThisWave >= game.maxEnemiesThisWave) {
                    if (game.enemies.length === 0) {
                        game.isRunning = false;
                        btnStart.textContent = '开始';
                    }
                    return;
                }
                game.enemySpawnTimer -= dt;
                if (game.enemySpawnTimer <= 0) {
                    spawnEnemy();
                    game.enemiesThisWave++;
                    game.enemySpawnTimer = game.spawnInterval;
                    updateUI();
                }
            }

            function updateGame(dt) {
                if (!game.isRunning && game.health <= 0) return;
                updateEnemies(dt);
                updateBullets(dt);
                updateTowers(dt);
                updateWave(dt);
                updateUI();
            }

            // ---------- 绘图 ----------
            function drawPath() {
                ctx.beginPath();
                ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
                for (var i=1; i<pathPoints.length; i++) {
                    ctx.lineTo(pathPoints[i].x, pathPoints[i].y);
                }
                ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--path-stroke').trim() || 'rgba(80,100,150,0.18)';
                ctx.lineWidth = 22;
                ctx.lineJoin = 'round';
                ctx.lineCap = 'round';
                ctx.stroke();
                ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--path-color').trim() || 'rgba(120,140,180,0.20)';
                ctx.lineWidth = 18;
                ctx.stroke();
            }

            function drawEnemies() {
                for (var i=0; i<game.enemies.length; i++) {
                    var e = game.enemies[i];
                    if (!e.alive) continue;
                    var cx = e.x, cy = e.y;
                    var rad = 10;
                    if (e.type === 'tank') rad = 16;
                    else if (e.type === 'fast') rad = 8;
                    ctx.beginPath();
                    if (e.type === 'tank') {
                        ctx.arc(cx, cy, rad, 0, 2*Math.PI);
                        ctx.fillStyle = '#6a4a3a';
                        ctx.fill();
                        ctx.strokeStyle = '#3a2a1a';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        ctx.fillStyle = '#8a6a5a';
                        ctx.beginPath();
                        ctx.arc(cx-4, cy-4, 4, 0, 2*Math.PI);
                        ctx.fill();
                    } else if (e.type === 'fast') {
                        ctx.beginPath();
                        ctx.moveTo(cx+rad, cy);
                        ctx.lineTo(cx-rad, cy-rad);
                        ctx.lineTo(cx-rad, cy+rad);
                        ctx.closePath();
                        ctx.fillStyle = '#4ab0d0';
                        ctx.fill();
                        ctx.strokeStyle = '#2a7090';
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                    } else {
                        ctx.arc(cx, cy, rad, 0, 2*Math.PI);
                        ctx.fillStyle = '#c05030';
                        ctx.fill();
                        ctx.strokeStyle = '#802020';
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                    }
                    // 血量条
                    var hpW = rad*1.8;
                    var hpH = 3;
                    var hpX = cx - hpW/2;
                    var hpY = cy - rad - 6;
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.fillRect(hpX, hpY, hpW, hpH);
                    var ratio = e.hp / e.maxHp;
                    if (ratio < 0) ratio = 0;
                    ctx.fillStyle = '#e03030';
                    ctx.fillRect(hpX, hpY, hpW * ratio, hpH);
                }
            }

            function drawTowers() {
                for (var i=0; i<game.towers.length; i++) {
                    var t = game.towers[i];
                    var cx = t.x, cy = t.y;
                    var rad = t.radius;
                    ctx.beginPath();
                    ctx.arc(cx, cy, rad, 0, 2*Math.PI);
                    var grad = ctx.createRadialGradient(cx-4, cy-4, 2, cx, cy, rad);
                    if (t.type === 'fire') {
                        grad.addColorStop(0, '#ff8a5a');
                        grad.addColorStop(1, '#b04020');
                    } else if (t.type === 'ice') {
                        grad.addColorStop(0, '#7ad0ff');
                        grad.addColorStop(1, '#1a60b0');
                    } else {
                        grad.addColorStop(0, '#f5e04a');
                        grad.addColorStop(1, '#b08020');
                    }
                    ctx.fillStyle = grad;
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    // 不再绘制字母
                }
            }

            function drawBullets() {
                for (var i=0; i<game.bullets.length; i++) {
                    var b = game.bullets[i];
                    if (!b.alive) continue;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, 5, 0, 2*Math.PI);
                    ctx.fillStyle = b.color || '#ffcc44';
                    ctx.fill();
                    ctx.shadowBlur = 14;
                    ctx.shadowColor = b.color || '#ffcc44';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            function drawGrid() {
                var gridColor = getComputedStyle(document.documentElement).getPropertyValue('--grid-color').trim() || 'rgba(120,140,180,0.06)';
                ctx.strokeStyle = gridColor;
                ctx.lineWidth = 0.5;
                for (var x=0; x<CW; x+=40) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, CH);
                    ctx.stroke();
                }
                for (var y=0; y<CH; y+=40) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(CW, y);
                    ctx.stroke();
                }
            }

            function drawUIOverlay() {
                if (game.health <= 0) {
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(0, 0, CW, CH);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 44px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('游戏结束', CW/2, CH/2-10);
                    ctx.font = '22px sans-serif';
                    ctx.fillText('点击 "开始" 重新开始', CW/2, CH/2+50);
                }
            }

            function render() {
                ctx.clearRect(0, 0, CW, CH);
                drawGrid();
                drawPath();
                drawTowers();
                drawEnemies();
                drawBullets();
                drawUIOverlay();
            }

            // ---------- 游戏循环 ----------
            var lastTime = 0;
            var accumulator = 0;
            var fixedDelta = 1/60;

            function loop(time) {
                var dt = Math.min((time - lastTime) / 1000, 0.05);
                lastTime = time;
                if (game.isRunning) {
                    dt *= game.speed;
                    accumulator += dt;
                    while (accumulator >= fixedDelta) {
                        updateGame(fixedDelta);
                        accumulator -= fixedDelta;
                    }
                } else {
                    accumulator = 0;
                }
                render();
                requestAnimationFrame(loop);
            }

            // ---------- 事件绑定 ----------
            canvas.addEventListener('click', function(e) {
                var rect = canvas.getBoundingClientRect();
                var scaleX = canvas.width / rect.width;
                var scaleY = canvas.height / rect.height;
                var x = (e.clientX - rect.left) * scaleX;
                var y = (e.clientY - rect.top) * scaleY;
                if (game.selectedTower) {
                    var placed = placeTower(x, y, game.selectedTower);
                    if (placed) {
                        game.selectedTower = null;
                        updateButtons();
                    }
                }
            });

            function selectTower(type) {
                if (game.health <= 0) return;
                if (game.gold < towerCosts[type]) return;
                game.selectedTower = (game.selectedTower === type) ? null : type;
                updateButtons();
            }

            towerFire.addEventListener('click', function(e){ e.stopPropagation(); selectTower('fire'); });
            towerIce.addEventListener('click', function(e){ e.stopPropagation(); selectTower('ice'); });
            towerThunder.addEventListener('click', function(e){ e.stopPropagation(); selectTower('thunder'); });
            btnDeselect.addEventListener('click', function(e){ e.stopPropagation(); game.selectedTower = null; updateButtons(); });

            btnStart.addEventListener('click', function() {
                if (game.health <= 0) {
                    resetGame();
                    startWave();
                    return;
                }
                if (!game.isRunning) {
                    if (game.enemies.length === 0 && game.enemiesThisWave >= game.maxEnemiesThisWave) {
                        startWave();
                    } else {
                        game.isRunning = true;
                        btnStart.textContent = '暂停';
                    }
                } else {
                    game.isRunning = false;
                    btnStart.textContent = '开始';
                }
            });

            btnSpeed.addEventListener('click', function() {
                if (game.speed === 1) { game.speed = 2; btnSpeed.textContent = '2x'; }
                else if (game.speed === 2) { game.speed = 3; btnSpeed.textContent = '3x'; }
                else { game.speed = 1; btnSpeed.textContent = '加速'; }
            });

            btnRestart.addEventListener('click', function() {
                resetGame();
                updateUI();
                updateButtons();
            });

            themeToggle.addEventListener('click', function() {
                var html = document.documentElement;
                var current = html.getAttribute('data-theme');
                if (current === 'dark') {
                    html.removeAttribute('data-theme');
                    themeToggle.textContent = '主题';
                } else {
                    html.setAttribute('data-theme', 'dark');
                    themeToggle.textContent = '主题';
                }
            });

            // 初始化
            resetGame();
            updateUI();
            updateButtons();
            requestAnimationFrame(loop);
        })();
    </script>
</body>
</html>
