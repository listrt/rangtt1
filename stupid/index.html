<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>文字站</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
body{max-width:720px;margin:3rem auto;padding:0 16px;font-family:system-ui;}
.article-item{display:block;margin:12px 0;font-size:18px}
</style>
</head>
<body>
<h1>随笔文字库</h1>
<div id="main"></div>
<script>
// 仓库信息，对应你当前仓库
const OWNER = "listrt";
const REPO = "rangtt";
const container = document.getElementById("main");

function getParam(key){
  const search = new URLSearchParams(location.search);
  return search.get(key);
}
const articleId = getParam("id");

if(articleId){
  loadSingleArticle(articleId);
}else{
  loadArticleList();
}

// 加载文章列表
async function loadArticleList(){
  const url = `https://api.github.com/repos/${OWNER}/${REPO}/issues?labels=site-stupid,publish&state=open`;
  const res = await fetch(url);
  const list = await res.json();
  list.forEach(art=>{
    const a = document.createElement("a");
    a.className = "article-item";
    a.href = "?id="+art.number;
    a.textContent = art.title;
    container.appendChild(a);
  })
}

// 加载单篇文章详情
async function loadSingleArticle(num){
  const url = `https://api.github.com/repos/${OWNER}/${REPO}/issues/${num}`;
  const res = await fetch(url);
  const art = await res.json();
  container.innerHTML = `
    <h2>${art.title}</h2>
    <div>${marked.parse(art.body)}</div>
    <br><a href="./">← 返回列表</a>
  `;
}
</script>
</body>
</html>
