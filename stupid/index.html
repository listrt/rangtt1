<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{max-width:680px;margin:3rem auto;padding:0 1rem;color:#222;background:#f7f8fa}
        .auth-box,.publish-box{background:#fff;padding:1.25rem;border-radius:10px;margin-bottom:1.25rem;box-shadow:0 1px 4px #00000012}
        h2{margin-bottom:1rem;font-size:18px}
        input,textarea{width:100%;padding:0.75rem;border:1px solid #ddd;border-radius:6px;margin-bottom:0.75rem;font-size:15px}
        textarea{resize:none;height:80px;max-width:100%}
        button{padding:0.7rem 1.4rem;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer}
        button:disabled{background:#94b3ee;cursor:not-allowed}
        .msg-item{background:#fff;padding:1rem;border-radius:8px;margin-bottom:0.8rem}
        .msg-head{display:flex;justify-content:space-between;color:#666;font-size:13px;margin-bottom:0.4rem}
        .msg-content{margin:0.5rem 0}
        .like-btn{background:#ef4444}
        .hidden{display:none}
    </style>
</head>
<body>
    <div class="auth-box" id="authWrap">
        <h2>登录 / 注册</h2>
        <input placeholder="用户名" id="username">
        <input type="password" placeholder="密码" id="password">
        <button id="loginBtn">登录</button>
        <button id="regBtn">注册</button>
    </div>

    <div class="publish-box hidden" id="publishWrap">
        <h2>发布留言（最多20字）</h2>
        <textarea maxlength="20" placeholder="输入留言..." id="msgInput"></textarea>
        <div><span id="wordCount">0/20</span></div>
        <button id="sendBtn">提交</button>
    </div>

    <div id="messageList"></div>

    <script>
        const $ = sel => document.querySelector(sel);
        let currentUser = null;
        let userDB = {};
        let messageList = [];

        $("#msgInput").oninput = e=>{
            $("#wordCount").textContent = `${e.target.value.length}/20`;
        }

        function render(){
            const html = messageList.map(item=>`
                <div class="msg-item">
                    <div class="msg-head">
                        <span>${item.sender}</span>
                        <span>${item.time}</span>
                    </div>
                    <div class="msg-content">${item.content}</div>
                    <button class="like-btn" data-id="${item.id}">点赞 ${item.like}</button>
                </div>
            `).join("");
            $("#messageList").innerHTML = html;
            document.querySelectorAll(".like-btn").forEach(btn=>{
                btn.onclick=()=>{
                    const mid = btn.dataset.id;
                    const target = messageList.find(v=>v.id===mid);
                    if(target){
                        target.like++;
                        render();
                    }
                }
            })
        }

        $("#regBtn").onclick = ()=>{
            const name = $("#username").value.trim();
            const pwd = $("#password").value.trim();
            if(!name||!pwd) return alert("用户名密码不能为空");
            if(userDB[name]) return alert("用户名已存在");
            userDB[name] = pwd;
            alert("注册成功，请登录");
        }

        $("#loginBtn").onclick = ()=>{
            const name = $("#username").value.trim();
            const pwd = $("#password").value.trim();
            if(!userDB[name] || userDB[name] !== pwd){
                return alert("账号或密码错误");
            }
            currentUser = name;
            $("#authWrap").classList.add("hidden");
            $("#publishWrap").classList.remove("hidden");
            render();
        }

        $("#sendBtn").onclick = ()=>{
            const text = $("#msgInput").value.trim();
            if(!text) return alert("内容不能为空");
            messageList.unshift({
                id:Date.now().toString(),
                sender:currentUser,
                content:text,
                time:new Date().toLocaleString(),
                like:0
            })
            $("#msgInput").value="";
            $("#wordCount").textContent="0/20";
            render();
        }
    </script>
</body>
</html>
